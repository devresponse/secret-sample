name: CI
on:
  push:
    branches: [ main, master ]
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up secrets (trusted only)
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        shell: pwsh
        env:
          AGE_PRIVATE_KEY: ${{ secrets.AGE_PRIVATE_KEY }}
        run: |
          Set-Content -Path ".agekey" -Value $env:AGE_PRIVATE_KEY -NoNewline
          $env:SOPS_AGE_KEY_FILE = "$PWD/.agekey"
          sops -d secrets.yaml | Set-Content -Path "secrets.plain.yaml" -NoNewline
          Write-Host "Decrypted secrets for trusted build."
      - name: Fallback for forks
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        shell: pwsh
        run: |
          if (Test-Path ".env.example") {
            Copy-Item -Path ".env.example" -Destination ".env" -Force
            Write-Host "Using .env.example for fork PR."
          } else {
            Write-Host "No .env.example found; proceeding without secrets."
          }
      - name: Build
        run: echo "Put your build/test commands here"
